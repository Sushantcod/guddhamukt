<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Outer Circular Framing & GM Monogram -->
  <g transform="translate(50, 40)">
    <!-- Dark Navy Circle Segment (Left) -->
    <path
      d="M 200 40 
         A 160 160 0 0 0 70 260 
         A 160 160 0 0 0 170 350
         L 190 320
         A 130 130 0 0 1 100 240
         A 130 130 0 0 1 200 70
         Z"
      fill="#0F294A"
    />

    <!-- Stylized "G" Shape Left -->
    <path
      d="M 140 140
         A 65 65 0 1 0 140 260
         A 65 65 0 0 0 195 230
         L 195 190
         L 155 190
         L 155 212
         L 172 212
         A 42 42 0 0 1 140 238
         A 42 42 0 1 1 140 162
         A 42 42 0 0 1 175 180
         L 192 160
         A 65 65 0 0 0 140 140
         Z"
      fill="#0F294A"
    />

    <!-- Right Orange Crescent Arc -->
    <path
      d="M 200 40
         A 160 160 0 0 1 350 250
         A 160 160 0 0 1 230 355
         L 245 325
         A 130 130 0 0 0 320 230
         A 130 130 0 0 0 200 70
         Z"
      fill="#F97316"
    />

    <!-- Stylized "M" Structure with Tick/Check -->
    <!-- Left Orange Wing of M -->
    <path
      d="M 200 140
         L 230 190
         L 245 165
         L 215 115
         Z"
      fill="#F97316"
    />

    <!-- Dynamic Orange Tick Mark Apex -->
    <path
      d="M 230 190
         L 290 85
         L 310 100
         L 245 215
         Z"
      fill="#F97316"
    />

    <!-- Navy Right Pillar of M -->
    <path
      d="M 248 180
         L 248 260
         L 268 260
         L 268 145
         Z"
      fill="#0F294A"
    />

    <!-- Winding Asphalt Road Curving from Bottom to Center -->
    <path
      d="M 150 360
         C 200 320, 220 260, 225 170
         L 245 170
         C 240 270, 210 330, 220 360
         Z"
      fill="#0F294A"
    />

    <!-- Road Dashed Center-line Markers -->
    <path d="M 180 340 L 186 325" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 197 305 L 202 290" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <path d="M 210 270 L 214 255" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 219 235 L 222 222" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 226 205 L 228 195" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: GUDDHAMUTK -->
  <text
    x="250"
    y="445"
    text-anchor="middle"
    font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
    font-size="44"
    font-weight="900"
    fill="#0F294A"
    letter-spacing="4"
  >
    GADDHAMUKT
  </text>
</svg>
